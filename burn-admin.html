<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burn Admin — ArcPunks</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">ArcPunks</a>
    <nav class="nav-links" id="navLinks"></nav>
    <button class="btn btn-outline nav-cta" id="navWalletBtn">Connect Wallet</button>
  </header>

  <main class="burnpg" style="max-width:1000px;">
    <h1 class="headline burnpg-headline">Burn <span class="accent">Admin Dashboard</span></h1>
    <p class="subcopy burnpg-subcopy">Wallets ranked by GTD eligibility (5 NFT + 10,000 $PUNK burned).</p>

    <button class="btn btn-primary" id="scanBtn" style="margin-bottom:24px;">Scan Burn Activity</button>
    <p id="scanProgress" class="soft-scan-status"></p>

    <div id="resultsTable" style="text-align:left;"></div>
  </main>

  <script src="js/wallet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <script src="js/burn-admin.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
